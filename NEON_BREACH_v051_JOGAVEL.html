.fx-canvas{position:absolute;z-index:6;inset:0;width:100%;height:100%;pointer-events:none;opacity:.94}

.hardware-level{position:absolute;font-size:clamp(6px,.7vw,10px);bottom:2px;color:#cafffa}

.hardware-dots{display:flex;gap:4px;margin-top:7px}.hardware-dots b{width:5px;height:5px;background:#69ffb5;border-radius:50%;box-shadow:0 0 8px #64ffbb;animation:rack-blink 1.1s ease-in-out infinite alternate}.hardware-dots b:nth-child(2n){animation-delay:.6s}
.hardware-ram{display:flex;gap:4px;align-items:center}.hardware-ram i{width:8px;height:35px;border:1px solid #6effcb;background:linear-gradient(#226666,#102c45);box-shadow:0 0 12px #4cffe353}
.hardware-shield{position:absolute;left:65%;top:5%;color:#77e8ff;font-size:30px;text-shadow:0 0 18px #4fe9ff;animation:processor-hover 2.9s ease-in-out infinite}
.hardware-fan{position:absolute;right:3%;top:30%;width:32px;height:32px;border:2px solid #90bfe0;border-radius:50%;box-shadow:0 0 12px #62d5ff}
.hardware-fan i{display:block;position:absolute;inset:5px;background:conic-gradient(#69dced 0 60deg,transparent 60deg 120deg,#69dced 120deg 180deg,transparent 180deg 240deg,#69dced 240deg 300deg,transparent 300deg);animation:fan-rotate .6s linear infinite;border-radius:50%}

.hardware-side,.server-showcase-title{position:absolute;left:9px;right:9px;bottom:5px;z-index:2;display:flex;justify-content:space-between;gap:5px;color:#ccfff6;font-size:clamp(8px,.79vw,11px);font-weight:800;letter-spacing:1px;text-shadow:0 0 10px #000}
.hardware-side span,.server-showcase-title span{color:#82e8de;font-size:clamp(7px,.7vw,10px)}

.rack-row{position:absolute;inset:4px 15% 19px;display:flex;justify-content:center;align-items:center;gap:clamp(6px,2.6vw,34px);perspective:800px}
.server-rack{position:relative;width:clamp(30px,5vw,61px);height:75%;display:flex;flex-direction:column;justify-content:space-evenly;padding:6px 5px;background:linear-gradient(110deg,#34475e,#091626 45%,#263957);border:2px solid #6c9bb2;border-radius:4px;box-shadow:5px 5px 0 #050918,8px 8px 11px #0009;transform:rotateY(-9deg) rotateX(4deg)}

  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>

  function word(root,difficulty,ctx,onSolve,onMistake){
    const profile=mode(ctx,difficulty),corporate=profile==='boss'||profile==='nexacorp';
    const pool=DICTIONARY.filter(x=>corporate?x.level==='hard'&&(profile!=='nexacorp'||x.word.length>=9):x.level!=='hard'&&(profile!=='account1'||x.level==='easy'||x.word.length<=8));
    let remaining=shuffle(pool),round=0,chosen,target,letters,chosenIds,encrypted=[];
    const rounds=corporate?2:1;
    const ui=mk('div','word-ui'),clue=mk('div','word-clue'),slots=mk('div','word-slots'),bank=mk('div','word-bank');
    const info=mk('div','puzzle-aux');info.style.textAlign='center';
    const controls=mk('div','end-actions'),clear=btn('LIMPAR','btn secondary'),verify=btn('CONFIRMAR PALAVRA');
    let alive=true;
    function newWord(){
      chosen=remaining.shift()||pick(pool);target=chosen.word;
      encrypted=corporate?shuffle(Array.from({length:target.length},(_,i)=>i)).slice(0,profile==='nexacorp'?2:1).sort((a,b)=>a-b):[];
      letters=shuffle(target.split('').map((char,i)=>({char,id:i})).filter(x=>!encrypted.includes(x.id)));
      if(letters.map(x=>x.char).join('')===target)letters.reverse();
      chosenIds=Array(target.length).fill(null);encrypted.forEach(i=>chosenIds[i]='LOCK');
      ui.classList.toggle('word-long',target.length>=10);
      clue.replaceChildren();const eyebrow=mk('span','eyebrow',corporate?`CHAVE CORPORATIVA ${round+1}/${rounds} · ${encrypted.length} CARACTERE(S) CIFRADO(S)`:'DICA');
      const body=mk('div','',corporate?'SEM DICA · os símbolos ◈ representam letras corretas ocultas. Organize as demais letras.':chosen.clue);
      clue.append(eyebrow,body);render();
    }
    function put(id){if(chosenIds.includes(id))return;const empty=chosenIds.indexOf(null);if(empty===-1)return;chosenIds[empty]=id;render();}
    function render(){slots.replaceChildren();bank.replaceChildren();chosenIds.forEach((id,i)=>{
      const isLocked=id==='LOCK',letter=id===null?'·':isLocked?'◈':letters.find(x=>x.id===id).char;
      const cell=btn(letter,'word-cell'+(id!==null?' filled':'')+(isLocked?' encrypted':''));
      cell.disabled=isLocked;cell.setAttribute('aria-label',isLocked?`Letra cifrada fixa na posição ${i+1}`:id===null?`Espaço ${i+1}`:`Remover letra ${letter}`);
      cell.addEventListener('click',()=>{if(id!==null&&!isLocked){chosenIds[i]=null;render();}});slots.append(cell);
    });
    letters.forEach(letter=>{const used=chosenIds.includes(letter.id),item=btn(letter.char,'word-letter'+(used?' used':''));item.disabled=used;item.setAttribute('aria-label','Adicionar letra '+letter.char);item.addEventListener('click',()=>put(letter.id));bank.append(item);});
    info.textContent=`${chosenIds.filter(x=>x!==null).length}/${target.length} POSIÇÕES · ${corporate?'SEM DICA':'LETRAS EMBARALHADAS'}`;
    verify.disabled=chosenIds.includes(null);
    }
    clear.addEventListener('click',()=>{chosenIds=chosenIds.map(id=>id==='LOCK'?'LOCK':null);render();});
    verify.addEventListener('click',()=>{
      if(!alive||chosenIds.some(x=>x===null))return;
      const guess=chosenIds.map((id,i)=>id==='LOCK'?target[i]:letters.find(x=>x.id===id).char).join('');
      if(guess===target){round++;if(round===rounds){alive=false;info.textContent='CHAVE DECIFRADA ✓';onSolve();}
        else{ui.classList.add('word-step-success');setTimeout(()=>{if(!alive)return;ui.classList.remove('word-step-success');newWord();},530);}}
      else{onMistake('A palavra não foi reconhecida.');chosenIds=chosenIds.map(id=>id==='LOCK'?'LOCK':null);render();}
    });
    controls.append(clear,verify);ui.append(clue,slots,bank,info,controls);root.append(ui);
    newWord();return ()=>{alive=false;};
  }
  function memory(root,difficulty,ctx,onSolve,onMistake){
    const length=getSpec(ctx,difficulty).memory,n=length>=6?4:3;
    const seq=Array.from({length},()=>Math.floor(Math.random()*n*n));
    let destroyed=false,showing=false,index=0,playing=false,viewCount=0;const timers=[];
    const shell=mk('div','puzzle-wrapper'),grid=mk('div','matrix wide'),side=mk('div','puzzle-instructions');grid.style.setProperty('--n',n);
    const hint=mk('div','puzzle-hint',ctx.boss?'FIREWALL DE MEMÓRIA: uma única exibição. Repita a sequência inteira sem falhar.':'Observe os blocos acesos e repita a ordem. Pode rever a sequência sem penalidade.');
    const info=mk('div','puzzle-aux','OBSERVE A SEQUÊNCIA');const replay=btn('REVER SEQUÊNCIA','btn secondary'),nodes=[];
    const schedule=(fn,ms)=>{const id=setTimeout(()=>{if(!destroyed)fn();},ms);timers.push(id);};
    const clearTimers=()=>{timers.forEach(clearTimeout);timers.length=0;};
    function play(){if(destroyed||playing||(ctx.boss&&viewCount>0))return;
      viewCount++;
      clearTimers();playing=true;showing=true;index=0;replay.disabled=true;
      info.textContent='MEMORIZE...';nodes.forEach(n=>n.classList.remove('flash','correct','wrong'));
      const ontime=580+Math.min(8,ctx.ram||0)*65,interval=ontime+230;
      seq.forEach((v,i)=>{
        schedule(()=>nodes[v].classList.add('flash'),250+i*interval);
        schedule(()=>nodes[v].classList.remove('flash'),250+i*interval+ontime);
      });
      schedule(()=>{showing=false;playing=false;replay.disabled=!!ctx.boss;info.textContent=`REPITA A ORDEM · 0/${length}`;},seq.length*interval+260);
    }
    for(let i=0;i<n*n;i++){
      const node=btn(String(i+1).padStart(2,'0'),'memory-tile');
      node.addEventListener('click',()=>{
        if(destroyed||showing)return;
        if(seq[index]!==i){node.classList.add('wrong');schedule(()=>node.classList.remove('wrong'),350);
          const keep=onMistake('Sequência incorreta.');if(!destroyed)schedule(play,600);return;
        }
        node.classList.add('correct');schedule(()=>node.classList.remove('correct'),290);
        index++;info.textContent=`CORRETO · ${index}/${length}`;
        if(index===length){showing=true;onSolve();}
      });nodes.push(node);grid.append(node);
    }
    replay.addEventListener('click',play);side.append(hint,info,replay);shell.append(grid,side);root.append(shell);
    schedule(play,370);
    return ()=>{destroyed=true;clearTimers();};
  }
  // Uma rota Hamiltoniana construída ANTES das barreiras: todas as casas livres
  // possuem um trajeto comprovado, inclusive nos tabuleiros 8×8 e 10×10.
  function makeRouting(difficulty,ctx={}){
    const n=getSpec(ctx,difficulty).route,solution=[];
    const margin=Math.max(1,Math.floor(n*.23));
    let left=1+Math.floor(Math.random()*margin);
    let right=n-2-Math.floor(Math.random()*margin);
    for(let r=0;r<n;r++){
      if(r>0){if(r%2===1)left=1+Math.floor(Math.random()*margin);else right=n-2-Math.floor(Math.random()*margin);}
      if(left>=right-1){if(r%2===0)right=n-1;else left=0;}
      if(r%2===0){for(let c=left;c<=right;c++)solution.push(at(r,c,n));}
      else{for(let c=right;c>=left;c--)solution.push(at(r,c,n));}
    }
    // O início/fim ficam ancorados na rota; paredes são todo o complemento.
    const blocked=new Set(Array.from({length:n*n},(_,i)=>i).filter(i=>!solution.includes(i)));
    return {n,start:solution[0],end:solution.at(-1),blocked,solution,free:solution.length};
  }
  function routing(root,difficulty,ctx,onSolve,onMistake){
    const board=makeRouting(difficulty,ctx),{n,start,end,blocked,free}=board;
    const trail=[start];let alive=true,dragging=false;
    const checkpoints=ctx.boss?[board.solution[Math.floor(free*.32)],board.solution[Math.floor(free*.67)]]:[];
    const shell=mk('div','puzzle-wrapper'),grid=mk('div','matrix'),side=mk('div','puzzle-instructions');grid.style.setProperty('--n',n);
    const hint=mk('div','puzzle-hint',ctx.boss?'ROTA CORPORATIVA: cubra todas as casas, evite barreiras e passe pelos portões 1 → 2 nesta ordem.':'Arraste para criar uma rota de IN até OUT, preenchendo TODAS as casas livres. Desvie das barreiras.');
    const status=mk('div','puzzle-aux'),undo=btn('DESFAZER','btn secondary'),clear=btn('REINICIAR','btn secondary');
    const nodes=[];
    function render(){nodes.forEach((node,i)=>{
      node.classList.toggle('selected',trail.includes(i));node.classList.toggle('current',trail.at(-1)===i);
      node.textContent=blocked.has(i)?'▨':i===start?'IN':i===end?'OUT':checkpoints.includes(i)?String(checkpoints.indexOf(i)+1):trail.includes(i)?'•':'';
    });status.innerHTML=`<span class="route-progress">${trail.length}/${free}</span> CASAS PREENCHIDAS`;
    }
    function use(i){if(!alive||blocked.has(i)||i===undefined)return;
      const last=trail.at(-1),previous=trail.at(-2);
      if(i===previous){trail.pop();render();return;}
      if(i===last)return;
      if(!neighbors(last,n).includes(i)||trail.includes(i))return;
      if(ctx.boss&&i===checkpoints[1]&&!trail.includes(checkpoints[0])){onMistake('Portas de segurança fora de ordem.');return;}
      if(i===end&&trail.length+1!==free)return;
      trail.push(i);render();
      if(i===end&&trail.length===free){alive=false;status.textContent='TODOS OS NÓS CONECTADOS ✓';setTimeout(onSolve,420);}
    }
    for(let i=0;i<n*n;i++){
      const node=btn('',`route-tile${blocked.has(i)?' blocked':''}${i===start?' start':''}${i===end?' end':''}`);
      node.dataset.cell=String(i);node.setAttribute('aria-label',blocked.has(i)?'Barreira bloqueada, não selecionável':`Quadrado ${i+1}`);node.disabled=blocked.has(i);
      nodes.push(node);grid.append(node);
    }
    grid.addEventListener('pointerdown',e=>{
      if(!alive)return;
      const node=e.target.closest('[data-cell]');if(!node)return;
      e.preventDefault();dragging=true;grid.setPointerCapture(e.pointerId);use(Number(node.dataset.cell));
    });
    grid.addEventListener('pointermove',e=>{
      if(!dragging||!alive)return;
      const node=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell]');
      if(node&&grid.contains(node))use(Number(node.dataset.cell));
    });
    const endDrag=()=>{dragging=false;};
    grid.addEventListener('pointerup',endDrag);grid.addEventListener('pointercancel',endDrag);
    undo.addEventListener('click',()=>{if(trail.length>1){trail.pop();render();}});
    clear.addEventListener('click',()=>{trail.splice(1);render();});
    const actions=mk('div','puzzle-actions');actions.append(undo,clear);
    side.append(hint,status,actions);shell.append(grid,side);root.append(shell);render();
    return ()=>{alive=false;};
  }
  /* 0.4 — Passar a argola pelo circuito metálico.
     Distância de colisão calculada no espaço do SVG; não há hitboxes invisíveis. */
  function ring(root,difficulty,ctx,onSolve,onMistake){
    const profile=mode(ctx,difficulty),spec=getSpec(ctx,difficulty),boss=profile==='boss'||profile==='nexacorp';
    const amplitude=spec.ringAmplitude,w=850,h=290,startX=48,finishX=802;
    const samples=Array.from({length:260},(_,i)=>{
      const x=startX+(finishX-startX)*i/259,u=i/259;
      const taper=Math.pow(Math.sin(Math.PI*u),.72);
      const rough=profile==='account1'? .13:profile==='account2'?.20:.34;
      return {x,y:145+amplitude*taper*(.67*Math.sin(u*Math.PI*spec.ringCycles*2+.5)+rough*Math.sin(u*Math.PI*(spec.ringCycles+2)*2-.3))};
    });
    const path=samples.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const travel=spec.returnTrip?[...samples,...samples.slice(0,-1).reverse()]:samples;
    const total=travel.length-1,start=samples[0],finish=samples.at(-1),scale=spec.ringScale;
    const tolerance={account1:22,account2:20,boss:14,nexacorp:10}[profile];
    let active=false,alive=true,done=false,position=0,ringAt={...start};
    const ui=mk('div','ring-ui'),head=mk('div','ring-head');
    head.innerHTML=`<div><span class="eyebrow">${profile==='nexacorp'?'CONTROLE MESTRE · IDA E VOLTA':boss?'PORTA DE SEGURANÇA • ARGOLA REDUZIDA':'DESAFIO DE PRECISÃO'}</span><div class="ring-headline">${spec.returnTrip?'VÁ AO OUT E VOLTE AO IN':'SIGA O FIO SEM ENCOSTAR'}</div></div><span class="pill">ARGOLA ×${scale.toLocaleString('pt-BR')}</span>`;
    const board=document.createElementNS('http://www.w3.org/2000/svg','svg');
    board.setAttribute('viewBox','0 0 850 290');board.setAttribute('class','ring-board');board.setAttribute('role','img');
    board.setAttribute('aria-label','Deslize a argola de IN até OUT'+(spec.returnTrip?' e retorne a IN':'')+' sem sair da área segura do fio');
    const outerRadius=25*scale,shadowRadius=outerRadius+2;
    board.innerHTML=`<defs><filter id="ring-glow"><feGaussianBlur stdDeviation="6"/></filter><linearGradient id="iron-gradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".40" stop-color="#a1acbd"/><stop offset="1" stop-color="#26394f"/></linearGradient></defs>
      <g class="ring-grid-lines"><path d="M0 73H850 M0 146H850 M0 219H850 M170 0V290 M340 0V290 M510 0V290 M680 0V290"/></g>
      <path d="${path}" class="ring-wire-glow"/><path d="${path}" class="ring-wire"/>
      <circle cx="${start.x}" cy="${start.y}" r="31" class="ring-terminal"/><circle cx="${finish.x}" cy="${finish.y}" r="30" class="ring-terminal finish"/>
      <text x="${start.x}" y="${start.y-40}" text-anchor="middle" class="ring-label">IN</text><text x="${finish.x}" y="${finish.y-40}" text-anchor="middle" class="ring-label">OUT</text>
      <g class="ring-runner" transform="translate(${start.x} ${start.y})"><circle r="${shadowRadius}" class="ring-outline-shadow"/><circle r="${outerRadius}" class="ring-outline"/><circle r="3" class="ring-center"/><path d="M-${outerRadius*.6} -${outerRadius*.67}L-${outerRadius*.35} -${outerRadius*.87} M${outerRadius*.4} ${outerRadius*.83}L${outerRadius*.65} ${outerRadius*.6}" class="ring-glint"/></g>`;
    const runner=board.querySelector('.ring-runner'),note=mk('div','ring-footer'),status=mk('span','ring-status','SEGURE A ARGOLA EM IN E ARRASTE ATÉ OUT'),progress=mk('div','ring-progress');progress.innerHTML='<div></div>';
    const reset=btn('RECOMEÇAR','btn secondary');
    const decorate=()=>{runner.setAttribute('transform',`translate(${ringAt.x.toFixed(2)} ${ringAt.y.toFixed(2)})`);progress.firstElementChild.style.width=(position/total*100).toFixed(1)+'%';};
    function resetRing(){active=false;position=0;ringAt={...start};board.classList.remove('ring-danger');status.textContent=spec.returnTrip?'TOQUE O OUT E RETORNE AO IN':'SEGURE A ARGOLA EM IN E ARRASTE ATÉ OUT';decorate();}
    const coords=e=>{const v=board.createSVGPoint();v.x=e.clientX;v.y=e.clientY;const inv=board.getScreenCTM()?.inverse();return inv?v.matrixTransform(inv):{x:-100,y:-100};};
    function collision(){active=false;board.classList.add('ring-danger');resetRing();board.classList.add('ring-danger');status.textContent='CONTATO! VOLTE AO IN';setTimeout(()=>{if(alive)board.classList.remove('ring-danger');},460);onMistake('A argola tocou o fio. Reinicie o percurso.');}
    function move(e){if(!active||!alive||done)return;
      const p=coords(e);let best=Infinity,nearest=-1;
      for(let i=Math.max(0,position-12);i<Math.min(total,position+28);i++){
        const a=travel[i],b=travel[i+1],dx=b.x-a.x,dy=b.y-a.y;
        const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)));
        const d=Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
        if(d<best){best=d;nearest=i;}
      }
      if(best>tolerance){collision();return;}
      if(nearest<position-6)return;
      position=Math.max(position,Math.min(nearest,position+15));ringAt={x:p.x,y:p.y};decorate();
      const turnaround=spec.returnTrip&&position>=259;
      status.textContent=`PERCURSO ${Math.round(position/total*100)}% · ${turnaround?'RETORNE AO IN':'SEM CONTATO'}`;
      const endpoint=spec.returnTrip?start:finish;
      if(position>=total-5&&Math.hypot(p.x-endpoint.x,p.y-endpoint.y)<43){done=true;active=false;board.classList.add('ring-victory');status.textContent='PERCURSO COMPLETO ✓';setTimeout(()=>{if(alive)onSolve();},640);}
    }
    board.addEventListener('pointerdown',e=>{if(done||!alive)return;const p=coords(e);if(Math.hypot(p.x-start.x,p.y-start.y)>44){status.textContent='COMECE NO IN';return;}e.preventDefault();resetRing();active=true;board.setPointerCapture(e.pointerId);move(e);});
    board.addEventListener('pointermove',e=>{if(active){e.preventDefault();move(e);}});
    board.addEventListener('pointerup',()=>{if(active&&!done)resetRing();});board.addEventListener('pointercancel',()=>{if(active)resetRing();});
    reset.addEventListener('click',resetRing);note.append(status,progress,reset);ui.append(head,board,note);root.append(ui);resetRing();return ()=>{alive=false;active=false;};
  }
  /* 0.4 — Dois potenciômetros ajustam amplitude e comprimento da onda, comparados
     visualmente contra o sinal de referência. Chefe = sincronização em 2 frequências. */
  function frequency(root,difficulty,ctx,onSolve,onMistake){
    const boss=!!ctx.boss,rounds=getSpec(ctx,difficulty).waves;
    let round=1,alive=true,amp=30,wave=126;
    const ui=mk('div','freq-ui'),display=mk('div','freq-view');
    const targetLabel=mk('div','freq-top');
    targetLabel.innerHTML=`<span class="eyebrow">${boss?'FIREWALL HARMÔNICO · CANAL '+round+'/'+rounds:'ANÁLISE DO SINAL'}</span><span class="freq-legend"><i></i> REFERÊNCIA <em></em> SEU SINAL</span>`;
    const screen=document.createElementNS('http://www.w3.org/2000/svg','svg');screen.setAttribute('viewBox','0 0 850 290');screen.setAttribute('class','freq-screen');screen.setAttribute('role','img');screen.setAttribute('aria-label','Comparação de duas ondas. Ajuste amplitude e comprimento para coincidir com a onda de referência.');
    screen.innerHTML=`<defs><linearGradient id="freq-trace" x1="0" x2="1"><stop stop-color="#3affd1"/><stop offset="1" stop-color="#65b7ff"/></linearGradient></defs><path class="freq-mid" d="M0 145H850"/><g class="freq-grid"><path d="M0 72.5H850 M0 217.5H850 M106 0V290 M212 0V290 M318 0V290 M424 0V290 M530 0V290 M636 0V290 M742 0V290"/></g><path class="freq-reference"/><path class="freq-player"/>`;
    const ref=screen.querySelector('.freq-reference'),out=screen.querySelector('.freq-player');
    const controls=mk('div','freq-controls');
    const waveRow=mk('div','freq-control'),ampRow=mk('div','freq-control');
    const waveLabel=mk('label','freq-label');waveLabel.htmlFor='wave-slider';
    const ampLabel=mk('label','freq-label');ampLabel.htmlFor='amp-slider';
    const waveInput=document.createElement('input');waveInput.id='wave-slider';waveInput.type='range';waveInput.min=65;waveInput.max=190;waveInput.step=1;waveInput.value=wave;waveInput.setAttribute('aria-label','Comprimento da onda');

 return `<div class="skill-card skill-node ${lvl?'active':''} ${!unlocked?'locked':''}" data-skill="${id}"><div class="node-led ${lvl?'charged':''}"></div><div class="header"><span>${d.icon} ${lvl?'ATIVO':'NOVO'}</span><span>LV ${lvl}/${d.costs.length}</span></div><h3>${d.name}</h3><div class="thin-note">${skillDescription(id,lvl)}</div><div class="setting-line"><button class="ghost-btn" data-action="skill-info" data-id="${id}">ⓘ</button><button class="btn mini" data-action="buy-skill" data-id="${id}" ${!unlocked||max||state.sp<cost?'disabled':''}>${!unlocked?lockLabel:max?'MÁX':cost+' SP'}</button></div></div>`;
}
function renderBase(){let out=pageTitle('CENTRAL / AUTOMAÇÃO','CENTRAL',`<button class="ghost-btn" data-action="base-help">ⓘ DETALHES</button>`);
 const server=!!skill('server'),bot=!!skill('bot'),sCost=purchasePrice(1200,state.serverLv),bCost=purchasePrice(800,state.botLv);
 out+=serverScene();out+=`<div class="base-grid"><div class="base-card"><div class="setting-line"><span class="base-title">▤ SERVIDOR</span><span class="pill ${server?'green':''}">${server?'ATIVO':state.bossLevel>=1?'DISPONÍVEL NA ÁRVORE':'🔒 NEXACORP 1'}</span></div><div class="base-value">${money(serverRate())}/s</div><div class="setting-line"><span class="tiny">Nível ${state.serverLv}</span><button class="btn mini" data-action="buy-server" ${!server||state.money<sCost?'disabled':''}>+ MELHORAR ${money(sCost)}</button></div></div>
 <div class="base-card"><div class="setting-line"><span class="base-title">⌘ BOT AUTOMÁTICO</span><span class="pill ${bot?'purple':''}">${bot?'ATIVO':state.bossLevel>=2?'DISPONÍVEL NA ÁRVORE':'🔒 NEXACORP 2'}</span></div><div class="base-value">${bot?Math.round(botChance()*100)+'%':'—'}</div><div class="setting-line"><span class="tiny">${bot?'SUCESSO · LV '+state.botLv:'AGUARDA LIBERAÇÃO'}</span><button class="btn mini" data-action="buy-bot" ${!bot||state.money<bCost?'disabled':''}>+ MELHORAR ${money(bCost)}</button></div></div></div>`;
 out+=`<div class="setting-line" style="margin-top:11px"><div class="tag-line"><span class="pill">RASTRO ${Math.floor(state.trace)}%</span><button class="ghost-btn" data-action="clear-trace">LIMPAR −25% · ${money(clearCost())}</button></div><div class="tag-line"><button class="ghost-btn" data-action="toggle-safe" ${!bot?'disabled':''}>${state.botSafe?'☑':'☐'} BOT SEGURO</button><button class="ghost-btn" data-action="toggle-bot" ${!bot?'disabled':''}>${state.botPaused?'▶ RETOMAR':'Ⅱ PAUSAR'}</button><button class="ghost-btn" data-action="settings">⚙</button></div></div>`;
 $('game-area').innerHTML=out;
}
function render(){hud();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));
 if(run)return;
 if(tab==='targets')renderTargets();if(tab==='gear')renderGear();if(tab==='skills')renderSkills();if(tab==='base')renderBase();
}
function traceAdd(value){const adjusted=value*(1-gear('firewall')*.08);state.trace+=adjusted;
 if(state.trace>=100){investigate();return true;}hud();return false;
}
function investigate(){
 abandonRun();const lost=Math.floor(state.money*.2),progressLost=Math.ceil(state.progress*.25);
 state.money=Math.max(0,state.money-lost);state.progress=Math.max(0,state.progress-progressLost);state.trace=30;
 save();render();
 infoModal('INVESTIGAÇÃO ATIVADA',`<p>O rastreamento atingiu 100%. Seus equipamentos e habilidades foram preservados.</p><p style="color:#ff94a4">−${money(lost)} em créditos<br>−${progressLost} contas de progresso</p><p>Rastreamento reiniciado em <strong>30%</strong>.</p>`);
}
function abandonRun(){window.NEON_FX.setPlaying(false);window.NEON_FX.stopCinema();if(puzzleStop){puzzleStop();puzzleStop=null;}run=null;$('phone-screen').classList.remove('boss-active');$('phone-screen').dataset.bossPhase='0';}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
// Sacola persistente: só volta a repetir quando os outros cinco já passaram.
function drawPuzzle(){
 if(!state.puzzleBag.length){
  state.puzzleBag=shuffle(PUZZLE_TYPES);
  if(state.lastPuzzle===state.puzzleBag[0]){
   const swap=state.puzzleBag.findIndex(x=>x!==state.lastPuzzle);
   [state.puzzleBag[0],state.puzzleBag[swap]]=[state.puzzleBag[swap],state.puzzleBag[0]];
  }
 }
 const next=state.puzzleBag.shift();state.lastPuzzle=next;save();return next;
}
function drawSequence(count){return Array.from({length:count},drawPuzzle);}
function startAccount(i){if(run||i===2&&!state.bossDone)return;
 start({tier:i,boss:false,sequence:Array(i===1?1:2).fill(null)});
}
function startBoss(){if(run||state.bossLevel>=BOSS_PHASES.length||state.progress<bossGoal())return;
 const p=currentPhase();
 // Mesmo em desafios longos, o conjunto de seis é completado antes de repetir.
 start({tier:p.tier,boss:true,bossPhase:state.bossLevel+1,sequence:Array(p.steps).fill(null)});
}
function stageFlash(boss){const layer=document.createElement('div');layer.className='stage-flash '+(boss?'boss-flash':'');$('phone-screen').append(layer);setTimeout(()=>layer.remove(),850);}
function start(info){if(puzzleStop)puzzleStop();run={...info,stage:0,errors:0,started:performance.now(),id:Math.random().toString(36).slice(2)};tab='targets';window.NEON_FX.setPlaying(true);
 if(info.boss){const phase=BOSS_PHASES[(info.bossPhase||1)-1];$('phone-screen').dataset.bossPhase=String(info.bossPhase);$('game-area').innerHTML='<div class="boss-loading">ACESSANDO REDE CORPORATIVA <span class="busy-bar"></span></div>';window.NEON_FX.cinema('NEXACORP',phase.name,info.bossPhase,()=>{if(!run||!run.boss)return;run.started=performance.now();showStage();});}else showStage();}
const puzzleName={circuit:'CIRCUITO DE ENERGIA',word:'PALAVRA EMBARALHADA',memory:'MEMÓRIA SEQUENCIAL',routing:'ROTA COMPLETA',ring:'ARGOLA ELÉTRICA',frequency:'SINTONIA DE FREQUÊNCIA'};
const bossName={circuit:'SOBRECARGA CORPORATIVA',word:'CÓDIGO DUPLO',memory:'MEMÓRIA DO FIREWALL',routing:'PORTAS DE ROTEAMENTO',ring:'FIO DE ALTA TENSÃO',frequency:'FIREWALL HARMÔNICO'};
function showStage(){if(!run)return;
 if(puzzleStop){puzzleStop();puzzleStop=null;}
 if(!run.sequence[run.stage])run.sequence[run.stage]=drawPuzzle();
 const token=run.id+'-'+run.stage,kind=run.sequence[run.stage],boss=run.boss;
 const profile=boss?(run.bossPhase===4?'nexacorp':'boss'):(run.tier===2?'account2':'account1');
 $('phone-screen').classList.toggle('boss-active',boss);$('phone-screen').dataset.bossPhase=boss?String(run.bossPhase):'0';
 $('game-area').innerHTML=`<div class="puzzle-layout"><div class="puzzle-top"><div><div class="eyebrow">${boss?'⚠ NEXACORP · NÍVEL '+run.bossPhase+'/4':'◈ CONTA NÍVEL '+run.tier} · ETAPA ${run.stage+1}/${run.sequence.length}</div><div class="puzzle-title">${boss?bossName[kind]:puzzleName[kind]}</div>${boss?`<div class="boss-stage-track">${run.sequence.map((_,i)=>`<span class="boss-stage-node ${i<run.stage?'done':i===run.stage?'live':''}"></span>`).join('')}</div>`:''}</div><div class="tag-line"><span class="pill ${boss?'red':''}">${boss?'QUALQUER ERRO = FALHA':'ERROS '+run.errors+'/3'}</span><button class="ghost-btn" data-action="puzzle-info" data-kind="${kind}">ⓘ</button><button class="ghost-btn" data-action="abort">SAIR ×</button></div></div><div class="puzzle-body" id="puzzle-host"></div><div class="puzzle-sub" style="text-align:center">${boss?'PROTOCOLO CORPORATIVO • PRECISÃO ABSOLUTA':'6 MODOS EM ROTAÇÃO • MAIS RÁPIDO = MAIS CRÉDITOS'}</div></div>`;
 const id=run.id,stage=run.stage;
 if(boss){const header=document.querySelector('.puzzle-top');header.classList.add('boss-entrance');}
 puzzleStop=window.NEON_PUZZLES.mount(kind,$('puzzle-host'),boss?Math.min(6,3+run.bossPhase):run.tier,{ram:gear('ram'),boss,bossPhase:run.bossPhase||0,profile},()=>{
  if(!run||run.id!==id||run.stage!==stage)return;
  window.NEON_FX.pulse('correct','#puzzle-host');run.stage++;
  if(run.stage>=run.sequence.length)complete();else{stageFlash(boss);notice(boss?'BARREIRA ROMPIDA ⚡':'SISTEMA AUTORIZADO ✓');showStage();}
 },message=>{
  if(!run||run.id!==id||run.stage!==stage)return;
  onMistake(message);
 });
}
function onMistake(message){if(!run)return;
 window.NEON_FX.pulse('error','#puzzle-host');run.errors++;state.mistakes++;
 const boss=run.boss,dead=boss||run.errors>=3;
 const tracked=traceAdd(dead?(boss?30:20):10);
 if(tracked)return;
 if(dead){const retryTier=run.tier;const loss=Math.floor(state.money*.05);state.money=Math.max(0,state.money-loss);state.failures++;abandonRun();save();render();
  infoModal(boss?'NEXACORP · TENTATIVA REINICIADA':'INVASÃO INTERROMPIDA',`<p>${html(message)}</p><p>${boss?'Qualquer erro em um chefe reinicia todos os enigmas da tentativa atual.':'Você atingiu o limite de 3 erros desta conta.'}</p><p style="color:#ff97a1">−${money(loss)} em créditos · rastreamento aumentado.</p>`,[{text:'TENTAR NOVAMENTE',fn:()=>{closePopup();boss?startBoss():startAccount(retryTier);},className:''},{text:'VOLTAR',fn:closePopup}]);
 }else{notice(message+' '+run.errors+'/3',true);const counter=document.querySelector('.puzzle-top .pill');if(counter)counter.textContent='ERROS '+run.errors+'/3';save();}
}
function complete(){if(!run)return;
 const result=run,elapsed=(performance.now()-run.started)/1000;abandonRun();stageFlash(result.boss);
 let earned=0,report='';
 if(result.boss){const phase=BOSS_PHASES[state.bossLevel];state.bossLevel++;state.bossDone=true;state.progress=0;state.sp+=phase.sp;earned=phase.reward;state.money+=earned;
  window.NEON_FX.victory(state.bossLevel);report=`<div class="boss-victory"><div class="boss-victory-icon">◈</div><strong>NEXACORP · SETOR ${state.bossLevel}/4</strong><p>${html(phase.name)} conquistado sem cometer erros.</p><div class="boss-loot"><span>+${money(earned)}</span><span>+${phase.sp} SP</span></div><p>🔓 ${html(phase.unlock)}</p>${state.bossLevel<4?'<p>A próxima camada requer invasões manuais da conta nível 2.</p>':'<p>Todas as quatro camadas dominadas! Novas empresas poderão ser adicionadas futuramente.</p>'}</div>`;
 }
 else{
  const tier=result.tier,t=DATA.tiers[tier-1],base=baseReward(tier),mult=premium(tier),precise=result.errors===0?(1+perfect()):1;
  const ideal=(tier===1?28:56)*(1+gear('cpu')*.08),pace=elapsed<=ideal?1:clamp(1-(elapsed-ideal)/Math.max(ideal*3,90)*.25,.75,1);
  earned=Math.round(base*mult*precise*pace);
  state.money+=earned;state.sp+=t.sp;
  if(tier===1){state.wins1++;if(state.bossLevel===0)state.progress=Math.min(bossGoal(),state.progress+1);}else{state.wins2++;if(state.bossLevel>0&&state.bossLevel<BOSS_PHASES.length)state.progress=Math.min(bossGoal(),state.progress+1);}
  report=`<p>Conta nível ${tier} concluída em <strong>${elapsed.toFixed(1).replace('.',',')}s</strong>.</p><p>Base aprimorada: <strong>${money(base)}</strong> · Premium ×${mult.toLocaleString('pt-BR')} · Sem erros: ${result.errors?'não':Math.round(perfect()*100)+'%'}</p><p>Desempenho de velocidade: <strong>${Math.round(pace*100)}%</strong>.</p><p style="color:#77fdd4;font-weight:900">+${money(earned)} &nbsp; +${t.sp} SP</p>`;
 }
 if(!result.boss)window.NEON_FX.pulse('win','#puzzle-host');const risk=traceAdd(result.boss?4:3);
 if(risk)return;
 save();render();infoModal(result.boss?'CAMADA NEXACORP DOMINADA':'ACESSO CONCLUÍDO',report,[{text:'CONTINUAR',fn:closePopup,className:''}]);
}
function failByAbort(){if(!run)return;const boss=run.boss;const loss=Math.floor(state.money*.05);abandonRun();state.money=Math.max(0,state.money-loss);state.failures++;if(traceAdd(boss?20:12))return;save();render();notice('Invasão encerrada · −'+money(loss),true);}
function purchaseGear(id){const d=DATA.gear.find(x=>x.id===id);if(!d)return;const current=gear(id),cost=purchasePrice(d.base,current);if(current>=d.max||state.money<cost)return;state.money-=cost;state.gear[id]=current+1;save();render();window.NEON_FX.pulse('upgrade','.hardware-bay');notice(d.name+' aprimorado.');}
function purchaseSkill(id){const d=DATA.skills.find(x=>x.id===id);if(!d||!skillUnlock(d))return;const current=skill(id),cost=d.costs[current];if(cost==null||state.sp<cost)return;state.sp-=cost;state.skills[id]=current+1;save();render();window.NEON_FX.pulse('upgrade',`[data-skill="${id}"]`);notice('Habilidade desbloqueada!');}
function clearCost(){return 120+Math.floor(state.trace*11);}
function purchaseServer(){if(!skill('server'))return;const c=purchasePrice(1200,state.serverLv);if(state.money<c)return;state.money-=c;state.serverLv++;save();render();window.NEON_FX.pulse('upgrade','.server-showcase');}
function purchaseBot(){if(!skill('bot'))return;const c=purchasePrice(800,state.botLv);if(state.money<c)return;state.money-=c;state.botLv++;save();render();window.NEON_FX.pulse('upgrade','.server-showcase');}
function automationTick(dt){if(skill('server'))state.money+=serverRate()*dt/1000;
 if(skill('bot')&&!state.botPaused&&!(state.botSafe&&state.trace>=80)){
  state.botClock+=dt;const interval=botInterval();if(state.botClock>=interval){state.botClock-=interval;
   const successful=Math.random()<botChance();if(successful){state.money+=Math.round(140*(1+.4*state.botLv)*(1+.30*skill('cashout')));}
   if(traceAdd((successful?1.5:4)*(1-.12*skill('mask'))))return;
  }
 }
}
function tick(){const now=Date.now();let dt=clamp(now-last,0,1500);last=now;if(document.hidden)return;if(dt>0)automationTick(dt);hud();if(now-lastSave>3500)save();}
function skillInfo(id){const d=DATA.skills.find(x=>x.id===id);if(!d)return;infoModal(d.name,`<p>${d.desc}</p><p>Nível atual: <strong>${skill(id)}/${d.costs.length}</strong>. Custos em pontos globais: ${d.costs.join(' / ')} SP.</p>${d.needPhase?`<p>Camada necessária: <strong>${d.needPhase}/4</strong>. ${d.requires?'Requer comprar '+DATA.skills.find(x=>x.id===d.requires).name+'.':''}</p>`:d.needBoss&&!state.bossDone?'<p>Exige derrotar a NEXACORP.</p>':''}`);}
function accountInfo(i){const t=DATA.tiers[i-1];infoModal(t.title,`<p>Saldo-base: <strong>${money(t.value)}</strong>. ${t.steps} ${t.steps===1?'enigma':'enigmas'} por conta. ${t.sp} SP por sucesso manual.</p><p>Recompensa = base aprimorada × premium × bônus sem erros × fator de velocidade. A demora reduz o prêmio, mas não encerra a tentativa.</p><p>${i===2?'Disponível após vencer a primeira camada da NEXACORP. A partir daí, invade-se a conta N2 para desbloquear novas camadas.':'As primeiras 15 invasões N1 liberam o primeiro confronto com a NEXACORP.'}</p>`);}
function exportSave(){const text=JSON.stringify({...state,lastSaved:Date.now()});
 infoModal('BACKUP DO PROGRESSO',`<p>Selecione e copie o texto abaixo para guardar seu jogo. Este backup pode ser importado nesta ou em outra instalação.</p><textarea class="save-area" readonly aria-label="Dados do save">${html(text)}</textarea>`,[{text:'FECHAR',fn:closePopup}]);
 const field=$('popup-content').querySelector('textarea');field.addEventListener('click',()=>field.select());field.focus();field.select();}
function importSave(){
 infoModal('IMPORTAR PROGRESSO',`<p>Cole aqui o backup em JSON exportado do jogo. A importação substitui o progresso atual. Aceita saves 0.2, 0.3, 0.4 e 0.5.</p><textarea id="save-import" class="save-area" aria-label="Cole o backup" placeholder="Cole seu save JSON..."></textarea>`,[
 {text:'CANCELAR',fn:closePopup},{text:'IMPORTAR',fn:()=>{
  try{const raw=$('save-import').value.trim(),obj=JSON.parse(raw);
   if(!obj||typeof obj!=='object'||![2,3,4,5].includes(obj.version)||!Number.isFinite(Number(obj.money))||!Number.isFinite(Number(obj.sp))||raw.length>100000)throw Error('Formato inválido');
   if(obj.version===2){localStorage.setItem(PREV_KEY,raw);localStorage.removeItem(KEY);localStorage.removeItem(LAST_KEY);localStorage.removeItem(LEGACY_V03);}
   else if(obj.version===3){localStorage.setItem(LEGACY_V03,raw);localStorage.removeItem(KEY);localStorage.removeItem(LAST_KEY);}
   else localStorage.setItem(KEY,raw);
   window.location.reload();
  }catch(e){notice('Backup inválido ou armazenamento indisponível.',true);}
 },className:''}]);}

 case 'open-money':infoModal('CRÉDITOS',`<p>Saldo atual: <strong>${money(state.money)}</strong>. Valores-base das contas: nível 1 = R$ 100; nível 2 = R$ 1.000 após NEXACORP.</p><p>Dinheiro compra equipamentos e melhorias de automação; SP compra talentos.</p>`);break;
 case 'open-points':infoModal('PONTOS GLOBAIS',`<p>Você tem <strong>${Math.floor(state.sp)} SP</strong>. Contas nível 1 dão 1 SP; nível 2 dão 2 SP. As quatro camadas NEXACORP concedem 5 / 8 / 12 / 18 SP.</p><p>Os SP podem ser investidos nas árvores já desbloqueadas e não são perdidos em investigações.</p>`);break;
 case 'open-trace':infoModal('RASTREAMENTO',`<p>Atual: <strong>${Math.floor(state.trace)}%</strong>. Cada erro aumenta o risco e as operações podem somar rastreamento.</p><p>Ao atingir 100%, você perde 20% do dinheiro e 25% do progresso para o chefe. O rastreamento retorna a 30%.</p><p>O valor fica congelado com o jogo fechado. Na CENTRAL é possível pagar para limpar 25 pontos.</p>`);break;
 case 'settings':infoModal('CONFIGURAÇÕES',`<p>Alpha 0.5.1 · Quatro perfis de dificuldade, seis enigmas alternados e salvamento automático offline.</p><p>O áudio é opcional e começa desligado. Ajuste a intensidade dos efeitos nas opções visuais.</p>`,[{text:'VISUAL E SOM',fn:visualSettings},{text:'EXPORTAR SAVE',fn:exportSave},{text:'IMPORTAR SAVE',fn:importSave},{text:'REINICIAR',className:'warning',fn:()=>infoModal('CONFIRMAR REINÍCIO',`<p>Isso apaga dinheiro, conquistas e melhorias salvas no navegador.</p>`,[{text:'CANCELAR',fn:closePopup},{text:'APAGAR',className:'warning',fn:()=>{state=initial();abandonRun();closePopup();tab='targets';save();render();}}])},{text:'FECHAR',fn:closePopup}]);break;
 }}
function dispatch(action,el){if(!action)return;
 if(['open-money','open-points','open-trace','account-info','details-progress','boss-info','gear-info','gear-help','skill-info','base-help','puzzle-info','settings'].includes(action)){openDetails(action,el);return;}
 if(action==='go-home'){if(run)notice('Encerre a invasão para voltar aos alvos.',true);else{tab='targets';render();}return;}
 if(action==='start-account')startAccount(Number(el.dataset.tier));
 if(action==='start-boss')startBoss();
 if(action==='abort')infoModal('ENCERRAR INVASÃO?',`<p>Você perderá 5% do dinheiro disponível e aumentará o rastreamento. Seu progresso de capítulo será mantido.</p>`,[{text:'CONTINUAR JOGANDO',fn:closePopup},{text:'ENCERRAR',className:'warning',fn:()=>{closePopup();failByAbort();}}]);
 if(action==='buy-gear')purchaseGear(el.dataset.id);
 if(action==='buy-skill')purchaseSkill(el.dataset.id);
 if(action==='skill-group'){skillGroup=el.dataset.group;renderSkills();}
 if(action==='buy-server')purchaseServer();
 if(action==='buy-bot')purchaseBot();
 if(action==='clear-trace'){const cost=clearCost();if(state.trace<1)return notice('Nenhum rastro a limpar.');if(state.money<cost)return notice('Créditos insuficientes.',true);state.money-=cost;state.trace=Math.max(0,state.trace-25);save();render();notice('Rastreamento reduzido em 25.');}
 if(action==='toggle-safe'){state.botSafe=!state.botSafe;save();render();}
 if(action==='toggle-bot'){state.botPaused=!state.botPaused;save();render();}
}
document.addEventListener('click',e=>{const tabBtn=e.target.closest('[data-tab]');if(tabBtn){if(run)return notice('Conclua ou encerre a invasão.',true);tab=tabBtn.dataset.tab;render();return;}const action=e.target.closest('[data-action]');if(action&&!action.disabled)dispatch(action.dataset.action,action);});
$('close-popup').addEventListener('click',closePopup);
$('popup').addEventListener('click',e=>{if(e.target===$('popup'))closePopup();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&popupOpen)closePopup();});
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{const away=clamp((Date.now()-state.lastSaved)/1000,0,8*3600);if(away>1&&skill('server'))state.money+=serverRate()*away;last=Date.now();save();hud();}});
// Feedback visual independente de CSS externo: ondulação a cada toque e paralaxe suave no desktop.
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 const rect=b.getBoundingClientRect(),dot=document.createElement('i');dot.className='tap-ripple';
 dot.style.left=(e.clientX-rect.left)+'px';dot.style.top=(e.clientY-rect.top)+'px';
 const oldPosition=getComputedStyle(b).position;
 if(oldPosition==='static')b.style.position='relative';
 b.append(dot);setTimeout(()=>dot.remove(),520);
});
// Estrutura 2.5D estática durante enigmas para manter as hitboxes precisas.
window.NEON_DEBUG={get:()=>structuredClone(state),drawPuzzle,drawSequence,allPuzzles:[...PUZZLE_TYPES],set:patch=>{state={...state,...patch,skills:{...state.skills,...(patch.skills||{})},gear:{...state.gear,...(patch.gear||{})}};save();render();},generateCircuit:()=>window.NEON_PUZZLES.test.makeCircuit(2),generateRouting:()=>window.NEON_PUZZLES.test.makeRouting(2)};
render();save();setInterval(tick,500);
})();

</script>
</body>
</html>
